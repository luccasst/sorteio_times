name: Atualizar pasta docs

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-site
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build para GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: npm run build
      - name: Atualizar pasta docs
        run: |
          rm -rf docs
          mkdir docs
          cp -r dist/. docs/
          touch docs/.nojekyll
      - name: Commit da pasta docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "docs sem mudanças"
            exit 0
          fi
          git commit -m "Atualiza site publicado em docs"
          git push
